name: ci

on:
  push:
    branches: [main, 'build/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Brand check (hex, PJ colors, forbidden strings, private font) on sources
        run: npm run check:brand
      - run: npm run typecheck
      - run: npm run build
      - run: npm run storybook:build
      - name: Brand check again, now covering build output
        run: npm run check:brand
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the built site (the audits and tests reuse it; no second build)
        run: |
          (npm run preview:built > preview.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/ || { cat preview.log; exit 1; }
      - name: Copy audit and fact trace against the served pages
        run: |
          python3 tools/copy_audit.py --base http://localhost:3000
          python3 tools/fact_trace.py --base http://localhost:3000
      - name: Visual, accessibility, keyboard and story-matrix tests
        env:
          PW_PREVIEW_CMD: npm run preview:built
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
