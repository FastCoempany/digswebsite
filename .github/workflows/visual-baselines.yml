name: visual-baselines

# Visual baselines are produced on the CI runner (same OS, fonts and rasterizer as the ci workflow),
# never on a laptop or a dev container: the same Chromium build renders text a few percent
# differently across machines. Run this workflow on a branch to refresh tests/visual/__screenshots__;
# it commits the result back to that branch. Then re-run ci (workflow_dispatch) to compare.

on:
  workflow_dispatch:
  # A workflow that has never run cannot be dispatched from a non-default branch (404), so the
  # first run happens on the push that adds or edits this file; after that use "Run workflow".
  push:
    branches: ['build/**']
    paths: ['.github/workflows/visual-baselines.yml']

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: regenerate baselines on the runner and push them
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run storybook:build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the built site
        run: |
          (npm run preview:built > preview.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/ || { cat preview.log; exit 1; }
      - name: Regenerate the page baselines and the marks strip
        env:
          PW_PREVIEW_CMD: npm run preview:built
        run: npm run test:visual -- --grep "@visual|@smoke" --update-snapshots
      - name: Commit and push the refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then echo "baselines unchanged"; exit 0; fi
          git commit -m "Visual baselines refreshed on the CI runner (visual-baselines workflow)"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__
          retention-days: 7
